name: Offline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: |
          node clones/harpoon-03/pilot-beta/test-live.cjs
          node clones/harpoon-03/pilot-beta/test-pad.cjs
          node clones/harpoon-03/pilot-beta/test-switch-start.cjs
          node clones/harpoon-03/pilot-beta/test-route-editor.cjs
      - working-directory: clones/harpoon-03/pilot-beta
        run: python -m unittest test_manual_critical test_network_recovery test_audit_fixes test_autonav test_smooth
      - run: python clones/harpoon-02/latest-20261014/build.py 1
